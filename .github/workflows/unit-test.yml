name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node_matrix:
    uses: appium/appium-workflows/.github/workflows/node-lts-matrix.yml@main

  test:
    needs:
    - node_matrix
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.node_matrix.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - uses: SocketDev/action@v1
      with:
        mode: firewall-free
    - name: Install dependencies (verbose)
      run: sfw npm install --loglevel verbose
    - name: Check appium-ios-remotexpc optional dependency
      if: always()
      run: |
        npm ls appium-ios-remotexpc --depth=0 || true
        if [ -d node_modules/appium-ios-remotexpc ]; then
          echo "appium-ios-remotexpc: installed ($(node -p "require('./node_modules/appium-ios-remotexpc/package.json').version"))"
        else
          echo "appium-ios-remotexpc: NOT in node_modules"
        fi
    - run: npm run lint
    - run: npm run format:check
    - run: npm run test
